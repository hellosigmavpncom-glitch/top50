<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Rise of Zhong</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#080b14;color:#f5f7ff;font-family:Arial,sans-serif;min-height:100vh}
header,main,.footer{width:100%;max-width:1900px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
h1{font-size:clamp(40px,3.8vw,60px);font-weight:950;letter-spacing:-1.5px;margin:0}
.subtitle,.handle,.caption{color:#a5b2ca}
.subtitle{font-size:18px;margin-top:6px}
.status{background:#172238;padding:14px 19px;border-radius:11px;font-size:16px;white-space:nowrap}
.creators{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch}
.creator{--accent:#7187ff;background:#141e32;border:2px solid var(--accent);border-radius:21px;padding:19px;display:flex;flex-direction:column;gap:17px;min-width:0}
.fede{--accent:#bd82ff}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:clamp(34px,3vw,47px);font-weight:950;margin:0}
.handle{font-size:17px;margin-top:5px}
.platform{font-size:14px;font-weight:900;color:var(--accent);background:#ffffff0c;padding:11px;border-radius:9px}
.top{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:11px;align-items:stretch}
.avatar-box,.main,.goal,.stats{background:#090f1c;border:1px solid #34415b;border-radius:15px;padding:15px;min-width:0}
.avatar-box{display:grid;place-items:center;min-height:170px}
.avatar{width:154px;height:154px;border-radius:50%;object-fit:cover;border:5px solid var(--accent);display:block}
.main{display:flex;flex-direction:column;justify-content:center}
.label{font-size:18px;font-weight:950;color:#b8c5dc;letter-spacing:.5px}
.big{font-size:clamp(29px,2.5vw,43px);font-weight:950;letter-spacing:-1px;margin-top:15px;white-space:nowrap}
.caption{font-size:14px;margin-top:10px}
.goal{border-color:var(--accent);background:linear-gradient(110deg,#18243a,#090f1c);display:flex;flex-direction:column;justify-content:center}
.goal-title{font-size:17px;font-weight:950;line-height:1.35}
.goal-number{font-size:clamp(27px,2.2vw,38px);font-weight:950;margin-top:16px;white-space:nowrap}
.remaining{font-size:clamp(15px,1.3vw,20px);font-weight:900;color:#c7d2e8;margin-top:13px;white-space:nowrap}
.stats{padding:16px;display:flex;flex-direction:column;gap:12px}
.stats-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats-title strong{font-size:21px;letter-spacing:.5px}
.stats-title span{font-size:12px;color:#a2afc8;white-space:nowrap}
.metrics{display:grid;grid-template-columns:1fr 1.3fr .85fr;gap:9px}
.metric{background:#172238;border:1px solid #35435e;border-radius:11px;padding:11px;min-width:0;display:flex;flex-direction:column;gap:9px}
.metric-title{font-size:18px;font-weight:950}
.value{background:#0b1220;border-radius:9px;padding:11px;min-width:0;min-height:77px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.value-label{font-size:12px;font-weight:950;color:#94b6ed}
.value-number{font-size:clamp(15px,1.25vw,20px);font-weight:950;white-space:nowrap;letter-spacing:-.4px}
.metric:nth-child(2) .value-number{font-size:clamp(14px,1.12vw,18px);letter-spacing:-.6px}
.odometer,.odometer.odometer-auto-theme,.odometer.odometer-theme-default{font-family:Arial,sans-serif!important;line-height:1.25!important;vertical-align:baseline;display:inline-block}
.odometer-digit,.odometer-digit-spacer{vertical-align:baseline}
.difference{margin-top:17px;padding:20px 24px;min-height:140px;background:#172238;border:1px solid #35435e;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.diff-label{font-size:21px;font-weight:950;color:#c3d0e7}
.diff-number{font-size:clamp(45px,4vw,64px);font-weight:950;margin-top:8px;line-height:1.4;min-height:1.4em;overflow:visible}
.leader{text-align:right;color:#b4c1d8;font-weight:900;font-size:17px}
.leader strong{display:block;color:white;font-size:30px;margin-top:7px}
.footer{display:flex;justify-content:space-between;gap:10px;color:#8492ac;font-size:13px;margin-top:12px;padding-bottom:8px}
@media(max-width:900px){
 .creator{padding:13px}
 .top{grid-template-columns:115px minmax(0,1fr) minmax(0,1fr);gap:8px}
 .avatar-box{min-height:120px}
 .avatar{width:105px;height:105px}
 .big{font-size:clamp(22px,2.5vw,32px)}
 .goal-number{font-size:clamp(22px,2vw,29px)}
 .metrics{grid-template-columns:1fr 1.2fr .85fr;gap:6px}
 .metric{padding:7px}
 .value{padding:8px}
 .metric-title{font-size:15px}
 .value-number{font-size:14px}
 .metric:nth-child(2) .value-number{font-size:12px}
}
@media(max-width:650px){
 body{padding:10px}
 header{align-items:flex-start;flex-direction:column}
 .creators{grid-template-columns:1fr}
 .top{grid-template-columns:95px minmax(0,1fr)}
 .avatar-box{min-height:100px}
 .avatar{width:86px;height:86px}
 .goal{grid-column:1/-1;min-height:130px}
 .metrics{grid-template-columns:1fr}
 .metric{padding:12px}
 .value-number,.metric:nth-child(2) .value-number{font-size:19px}
 .difference{align-items:flex-start;flex-direction:column}
 .leader{text-align:left}
 .footer{font-size:11px}
}
</style>
</head>
<body>
<header>
<div>
<h1>THE RISE OF ZHONG</h1>
<div class="subtitle">Live YouTube Subscriber Battle · Zhong vs Fede</div>
</div>
<div class="status" id="status">Connecting...</div>
</header>
<main>
<section class="creators" id="creators"></section>
<section class="difference">
<div>
<div class="diff-label">EXACT SUBSCRIBER DIFFERENCE</div>
<div class="diff-number odometer" id="difference">0</div>
</div>
<div class="leader">CURRENT LEADER<strong id="leader">Waiting...</strong></div>
</section>
</main>
<div class="footer">
<span>Live data · 5-second updates</span>
<span id="updated">Waiting for update</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/odometer@0.4.8/odometer.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),odometers={};
const creators=[['zhong','Zhong','@zhong'],['fede','Fede Vigevani','@fedevigevani']];
const next=n=>(Math.floor(n/1e6)+1)*1e6;
const fields=[['subs','Subscribers','subscriberCount'],['views','Views','viewCount'],['videos','Videos','videoCount']];
$('creators').innerHTML=creators.map(([k,name,handle])=>`
<article class="creator ${k==='fede'?'fede':''}">
<div class="heading"><div><h2>${name}</h2><div class="handle">${handle}</div></div><span class="platform">YOUTUBE</span></div>
<div class="top">
<div class="avatar-box"><img class="avatar" id="${k}-avatar" alt="${name}"></div>
<div class="main"><div class="label">LIVE SUBSCRIBERS</div><div class="big odometer" id="${k}-main">0</div><div class="caption">Estimated subscriber count</div></div>
<div class="goal"><div class="goal-title">NEXT MILLION MILESTONE</div><div class="goal-number odometer" id="${k}-goal">0</div><div class="remaining"><span class="odometer" id="${k}-left">0</span> remaining</div></div>
</div>
<div class="stats">
<div class="stats-title"><strong>CHANNEL STATISTICS</strong><span>ESTIMATED / API</span></div>
<div class="metrics">
${fields.map(([id,label])=>`<div class="metric"><div class="metric-title">${label}</div><div class="value"><div class="value-label">ESTIMATED</div><div class="value-number odometer" id="${k}-est-${id}">0</div></div><div class="value"><div class="value-label">API</div><div class="value-number odometer" id="${k}-api-${id}">0</div></div></div>`).join('')}
</div>
</div>
</article>`).join('');
function number(id,value){
 const el=$(id),n=Number(value);if(!el||!Number.isFinite(n))return;
 if(!window.Odometer){el.textContent=Math.round(n).toLocaleString('en-US');return}
 if(!odometers[id])odometers[id]=new Odometer({el,value:0,format:'(,ddd)',duration:700,theme:'default'});
 odometers[id].update(Math.round(n));
}
function update(k,c){
 if(!c)return null;
 const e=c.counters?.estimation||{},a=c.counters?.api||{},s=Number(e.subscriberCount);
 if(!Number.isFinite(s))return null;
 number(k+'-main',s);number(k+'-goal',next(s));number(k+'-left',Math.max(0,next(s)-s));
 fields.forEach(([id,,field])=>{number(k+'-est-'+id,e[field]);number(k+'-api-'+id,a[field])});
 if(c.avatar&&$(k+'-avatar').src!==c.avatar)$(k+'-avatar').src=c.avatar;
 return s;
}
async function refresh(){
 try{
  const r=await fetch('/api/stats',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
  const d=await r.json(),z=update('zhong',d.creators?.zhong),f=update('fede',d.creators?.fede);
  if(z!==null&&f!==null){number('difference',Math.abs(z-f));$('leader').textContent=z===f?'TIED':z>f?'Zhong':'Fede Vigevani'}
  $('status').textContent=d.error?'Some stats unavailable':'LIVE · CONNECTED';
  $('updated').textContent=d.updated?'Last update: '+new Date(d.updated).toLocaleTimeString():'Waiting for update';
 }catch(e){$('status').textContent='Connection error';console.error('[Dashboard] '+e.message)}
}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
