
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zhong vs Fede Vigevani</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/themes/odometer-theme-default.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-variant-numeric:tabular-nums}
body{background:radial-gradient(circle at center,#14141f 0%,#07070a 100%);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 12px;overflow:hidden}
header,.main-battle,.stats-container{width:100%;max-width:1850px}
header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1b1b28,#111118);padding:8px 16px;border-radius:10px;margin-bottom:6px;border:2px solid #3b82f6;box-shadow:0 0 20px rgba(59,130,246,.25);flex-shrink:0}
h1{font-size:1.5rem;letter-spacing:1.5px;font-weight:900;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-center{font-size:.85rem;color:#94a3b8;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:#1e1e2d;padding:4px 12px;border-radius:6px;border:1px solid #3f3f46}
.status-box{display:flex;align-items:center;gap:8px;font-size:.95rem;color:#cbd5e1;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444}
.dot.live{background:#22c55e;box-shadow:0 0 12px #22c55e}
.main-battle{display:flex;justify-content:center;align-items:stretch;gap:14px;margin-bottom:6px;flex-shrink:0}
.card,.middle-box,.stats-panel{background:linear-gradient(180deg,#181824,#111116);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card{border:2px solid #27272a;padding:10px 16px;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{width:175px;height:175px;border-radius:50%;object-fit:cover;border:4px solid #38bdf8;margin-bottom:6px;background:#18181b;box-shadow:0 0 20px rgba(56,189,248,.3);flex-shrink:0}
.card:nth-child(3) .avatar{border-color:#fbbf24;box-shadow:0 0 20px rgba(251,191,36,.3)}
.name{font-size:2.1rem;font-weight:900;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;color:#fff}
.country{font-size:.9rem;color:#94a3b8;margin-bottom:6px;font-weight:700}
.sub-label,.diff-title,.stat-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.sub-label{color:#94a3b8;margin-bottom:2px}
.est-subs{font-size:clamp(2.8rem,4.5vw,4.8rem);font-weight:900;color:#38bdf8;white-space:nowrap;margin-bottom:2px;line-height:1;text-shadow:0 0 15px rgba(56,189,248,.4)}
.api-subs{font-size:clamp(1.4rem,2vw,1.9rem);font-weight:800;color:#e2e8f0;white-space:nowrap}
.middle-box{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #fbbf24;padding:10px 20px;min-width:210px;text-align:center;box-shadow:0 0 20px rgba(251,191,36,.15)}
.diff-title{color:#fbbf24;margin-bottom:2px}
.diff-value{font-size:clamp(2.4rem,3.5vw,3.8rem);font-weight:900;color:#fbbf24;white-space:nowrap;margin-bottom:2px;line-height:1;text-shadow:0 0 15px rgba(251,191,36,.4)}
.diff-ahead{font-size:1.1rem;color:#22c55e;font-weight:800;white-space:nowrap}
.stats-container{display:flex;gap:14px;flex-grow:1;min-height:0}
.stats-panel{border:2px solid #27272a;padding:10px;flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:7px;align-content:stretch}
.stat-item{background:#16161f;padding:7px 10px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;min-width:0;border:1px solid #2e2e3d;contain:layout paint}
.stat-title{color:#94a3b8;margin-bottom:2px;letter-spacing:.4px;font-size:.7rem}
.stat-val{font-size:clamp(1.25rem,1.7vw,1.75rem);font-weight:900;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odometer{font-family:inherit;white-space:nowrap}
@media(max-width:1050px){body{height:auto;min-height:100vh;overflow:auto}.main-battle,.stats-container{flex-direction:column}.middle-box{width:100%}.stats-panel{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>ZHONG VS FEDE VIGEVANI</h1>
<div class="header-center">Data Source: SCTools API https://ests.sctools.org/api/ &bull; Polling: 5000ms</div>
<div class="status-box"><div id="dot" class="dot"></div><span id="txt">Connecting...</span><span id="time">--:--:--</span></div>
</header>
<div class="main-battle">
<div class="card">
<img id="av0" class="avatar" src="https://placehold.co/175x175/181824/38bdf8?text=Zhong" referrerpolicy="no-referrer" alt="">
<div id="n0" class="name">Zhong</div><div id="co0" class="country">--</div>
<div class="sub-label">Estimated Subscribers</div><div id="es0" class="est-subs odometer">0</div>
<div class="sub-label">API Subscribers</div><div id="as0" class="api-subs odometer">0</div>
</div>
<div class="middle-box">
<div class="diff-title">Subscriber Difference</div><div id="dv" class="diff-value odometer">0</div><div id="da" class="diff-ahead">Loading...</div>
</div>
<div class="card">
<img id="av1" class="avatar" src="https://placehold.co/175x175/181824/fbbf24?text=Fede" referrerpolicy="no-referrer" alt="">
<div id="n1" class="name">Fede Vigevani</div><div id="co1" class="country">--</div>
<div class="sub-label">Estimated Subscribers</div><div id="es1" class="est-subs odometer">0</div>
<div class="sub-label">API Subscribers</div><div id="as1" class="api-subs odometer">0</div>
</div>
</div>
<div class="stats-container">
<div class="stats-panel" id="p0"></div>
<div class="stats-panel" id="p1"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
<script>
'use strict';
const keys=['es','as','ev','iv','el','il','ec','ic','v','hg','dg','lc','tv'];
const labels=['Est Views','API Views','Est Likes','API Likes','Est Comments','API Comments','Videos','Hourly Growth','Daily Growth','Linear Subscribers','Channel Views'];
const ids=[],els=Object.create(null),odos=Object.create(null),last=Object.create(null),lastText=Object.create(null),lastAv=['',''];
let initialized=false,active=false,updateTimer=null;
const pendingUpdates=new Map();

['p0','p1'].forEach((p,i)=>{
  document.getElementById(p).innerHTML=keys.slice(2).map((k,j)=>`
    <div class="stat-item">
      <div class="stat-title">${labels[j]}</div>
      <div id="${k+i}" class="stat-val odometer">0</div>
    </div>`).join('');
});

document.querySelectorAll('[id]').forEach(el=>els[el.id]=el);
['es0','as0','es1','as1','dv',...keys.slice(2).map(k=>k+'0'),...keys.slice(2).map(k=>k+'1')].forEach(id=>ids.push(id));

const missing=[...ids,'dot','da','txt','time','av0','av1','n0','n1','co0','co1'].filter(id=>!els[id]);
if(missing.length)throw Error('Missing: '+missing.join(', '));

const updateText=(id,v)=>{const el=els[id],val=String(v??'');if(el&&lastText[id]!==val){el.textContent=val;lastText[id]=val;}};
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};

function initializeOdometers(values){
  ids.forEach(id=>{const n=num(values[id]);last[id]=n;els[id].textContent=n.toLocaleString('en-US');});
  initialized=true;
  let idx=0;
  (function batch(){
    const end=Math.min(idx+3,ids.length);
    for(;idx<end;idx++){
      const id=ids[idx];
      odos[id]=new Odometer({el:els[id],value:last[id],duration:300,format:'(,ddd)'});
    }
    if(idx<ids.length)setTimeout(batch,40);
  })();
}

function processUpdateQueue(){
  updateTimer=null;
  let count=0;
  for(const [id,val] of pendingUpdates){
    pendingUpdates.delete(id);
    if(val!==last[id]&&odos[id]){last[id]=val;odos[id].update(val);}
    if(++count>=2)break;
  }
  if(pendingUpdates.size)updateTimer=setTimeout(processUpdateQueue,75);
}

function queueOdometerUpdate(id,val){
  const n=num(val);
  if(n===last[id])return;
  pendingUpdates.set(id,n);
  if(updateTimer===null)updateTimer=setTimeout(processUpdateQueue,0);
}

async function poll(){
  if(active)return;
  active=true;
  try{
    const res=await fetch('/api/stats',{cache:'no-store'});
    if(!res.ok)throw Error('HTTP '+res.status);
    const d=await res.json();
    if(!d.success||!Array.isArray(d.channels)||d.channels.length!==2)throw Error('Invalid API response');
    const [a,b]=d.channels,s0=a.stats||{},s1=b.stats||{};
    const vals={
      es0:s0.estCount,as0:s0.apiCount,es1:s1.estCount,as1:s1.apiCount,dv:Math.abs(num(s0.estCount)-num(s1.estCount)),
      ev0:s0.estTotalViews,iv0:s0.apiTotalViews,el0:s0.estTotalLikes,il0:s0.apiTotalLikes,ec0:s0.estTotalComments,ic0:s0.apiTotalComments,v0:s0.videoCount,hg0:a.averages?.hourly??0,dg0:a.averages?.daily??0,lc0:s0.linearCount,tv0:s0.viewCount,
      ev1:s1.estTotalViews,iv1:s1.apiTotalViews,el1:s1.estTotalLikes,il1:s1.apiTotalLikes,ec1:s1.estTotalComments,ic1:s1.apiTotalComments,v1:s1.videoCount,hg1:b.averages?.hourly??0,dg1:b.averages?.daily??0,lc1:s1.linearCount,tv1:s1.viewCount
    };
    requestAnimationFrame(()=>{
      [a,b].forEach((c,i)=>{
        const info=c.info||{},img=info.avatar||info.image||info.avatarUrl||c.snippet?.thumbnails?.high?.url;
        if(img&&img!==lastAv[i]){els['av'+i].src=img;lastAv[i]=img;}
        updateText('n'+i,info.name||'Unknown');
        updateText('co'+i,info.country||'--');
      });
      const sA=num(s0.estCount),sB=num(s1.estCount);
      const ahead=sA>sB?(a.info?.name||'Zhong')+' is ahead':sB>sA?(b.info?.name||'Fede Vigevani')+' is ahead':"It's a tie!";
      const col=sA>sB?'#38bdf8':sB>sA?'#fbbf24':'#cbd5e1';
      updateText('da',ahead);
      if(els.da.style.color!==col)els.da.style.color=col;
      updateText('txt','Live');
      updateText('time',new Date(d.updatedAt).toLocaleTimeString());
      if(els.dot.className!=='dot live')els.dot.className='dot live';

      if(!initialized)initializeOdometers(vals);
      else ids.forEach(id=>queueOdometerUpdate(id,vals[id]));
    });
  }catch(e){
    if(els.dot.className!=='dot')els.dot.className='dot';
    updateText('txt','Reconnecting...');
  }finally{
    active=false;
    setTimeout(poll,5000);
  }
}
poll();
</script>
</body>
</html>
