<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zhong vs Fede</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-default.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#080b14;color:#f5f7ff;font-family:Arial,sans-serif;min-height:100vh}
header,main,.footer{max-width:1900px;width:100%;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:17px}
h1{font-size:clamp(30px,2.8vw,44px);margin:0;font-weight:950}
.subtitle,.handle,.caption{color:#a5b2ca}
.subtitle{font-size:16px;margin-top:6px}
.status{background:#172238;padding:12px 17px;border-radius:10px;font-size:15px;white-space:nowrap}
.creators{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;align-items:stretch}
.creator{--accent:#7187ff;background:#141e32;border:2px solid var(--accent);border-radius:19px;padding:18px;display:flex;flex-direction:column;gap:15px;min-width:0}
.fede{--accent:#bd82ff}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
h2{font-size:clamp(29px,2.5vw,41px);margin:0}
.handle{font-size:17px;margin-top:5px}
.platform{font-size:14px;font-weight:900;color:var(--accent);background:#ffffff0c;padding:10px;border-radius:8px}
.top{display:grid;grid-template-columns:125px minmax(0,1fr);gap:13px}
.avatar-box,.main,.goal,.stats{background:#090f1c;border:1px solid #34415b;border-radius:14px;padding:15px;min-width:0}
.avatar-box{display:grid;place-items:center}
.avatar{width:108px;height:108px;border-radius:50%;object-fit:cover;border:3px solid var(--accent)}
.label{font-size:16px;font-weight:900;color:#b8c5dc;letter-spacing:1px}
.big{font-size:clamp(39px,3.7vw,59px);font-weight:950;letter-spacing:-1px;margin-top:10px}
.caption{font-size:15px;margin-top:7px}
.goal{border-color:var(--accent);background:linear-gradient(110deg,#18243a,#090f1c);padding:17px}
.goal-title{font-size:19px;font-weight:950;letter-spacing:.5px}
.goal-number{font-size:clamp(35px,3vw,47px);font-weight:950;margin-top:10px}
.remaining{font-size:22px;font-weight:800;color:#c7d2e8;margin-top:8px}
.stats{padding:15px}
.stats-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.stats-title strong{font-size:21px;letter-spacing:1px}
.stats-title span{font-size:13px;color:#a2afc8}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.metric{background:#172238;border:1px solid #35435e;border-radius:11px;padding:11px;min-width:0}
.metric-title{font-size:18px;font-weight:950;margin-bottom:9px}
.value{background:#0b1220;border-radius:8px;padding:10px;margin-top:7px;min-width:0}
.value-label{font-size:12px;font-weight:900;color:#94a6c5;margin-bottom:6px}
.value-number{font-size:clamp(16px,1.25vw,21px);font-weight:950;white-space:nowrap;letter-spacing:-.4px}
.odometer,.odometer.odometer-auto-theme,.odometer.odometer-theme-default{font-family:inherit!important}
.difference{margin-top:15px;padding:17px 21px;background:#172238;border:1px solid #35435e;border-radius:15px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.diff-label{font-size:18px;font-weight:950;color:#c3d0e7}
.diff-number{font-size:clamp(38px,3.5vw,53px);font-weight:950;margin-top:6px}
.leader{text-align:right;color:#b4c1d8;font-weight:800;font-size:17px}
.leader strong{display:block;color:white;font-size:25px;margin-top:6px}
.footer{display:flex;justify-content:space-between;gap:10px;color:#8492ac;font-size:13px;margin-top:12px;padding-bottom:5px}
@media(max-width:1050px){.creators{grid-template-columns:1fr}.avatar{width:100px;height:100px}}
@media(max-width:600px){
 body{padding:10px}header{align-items:flex-start;flex-direction:column}
 .top{grid-template-columns:85px minmax(0,1fr)}
 .avatar{width:72px;height:72px}
 .creator{padding:12px;gap:12px}
 .metrics{grid-template-columns:1fr}
 .metric{padding:12px}
 .value-number{font-size:20px}
 .difference{align-items:flex-start;flex-direction:column}
 .leader{text-align:left}
 .footer{font-size:11px}
}
</style>
</head>
<body>
<header><div><h1>THE RISE OF ZHONG</h1><div class="subtitle">Live YouTube Subscriber Battle · Zhong vs Fede</div></div><div class="status" id="status">Connecting...</div></header>
<main>
<section class="creators" id="creators"></section>
<section class="difference"><div><div class="diff-label">EXACT SUBSCRIBER DIFFERENCE</div><div class="diff-number odometer" id="difference">0</div></div><div class="leader">CURRENT LEADER<strong id="leader">Waiting...</strong></div></section>
</main>
<div class="footer"><span>Live data · 5-second updates</span><span id="updated">Waiting for update</span></div>
<script src="https://cdn.jsdelivr.net/npm/odometer@0.4.8/odometer.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),odometers={};
const creators=[['zhong','Zhong','@zhong'],['fede','Fede Vigevani','@fedevigevani']];
const next=n=>(Math.floor(n/1e6)+1)*1e6;
const fields=[['subs','Subscribers','subscriberCount'],['views','Views','viewCount'],['videos','Videos','videoCount']];
$('creators').innerHTML=creators.map(([k,name,handle])=>`
<article class="creator ${k==='fede'?'fede':''}">
<div class="heading"><div><h2>${name}</h2><div class="handle">${handle}</div></div><span class="platform">YOUTUBE</span></div>
<div class="top"><div class="avatar-box"><img class="avatar" id="${k}-avatar" alt="${name}"></div><div class="main"><div class="label">LIVE SUBSCRIBERS</div><div class="big odometer" id="${k}-main">0</div><div class="caption">Estimated subscriber count</div></div></div>
<div class="goal"><div class="goal-title">NEXT MILLION MILESTONE</div><div class="goal-number odometer" id="${k}-goal">0</div><div class="remaining"><span class="odometer" id="${k}-left">0</span> remaining</div></div>
<div class="stats"><div class="stats-title"><strong>CHANNEL STATISTICS</strong><span>ESTIMATED / API</span></div><div class="metrics">
${fields.map(([id,label])=>`<div class="metric"><div class="metric-title">${label}</div><div class="value"><div class="value-label">ESTIMATED</div><div class="value-number odometer" id="${k}-est-${id}">0</div></div><div class="value"><div class="value-label">API</div><div class="value-number odometer" id="${k}-api-${id}">0</div></div></div>`).join('')}
</div></div></article>`).join('');
function number(id,value){
 const el=$(id),n=Number(value);if(!el||!Number.isFinite(n))return;
 if(!window.Odometer){el.textContent=Math.round(n).toLocaleString('en-US');return}
 if(!odometers[id])odometers[id]=new Odometer({el,value:0,format:'(,ddd)',duration:700,theme:'default'});
 odometers[id].update(Math.round(n));
}
function update(k,c){
 if(!c)return null;
 const e=c.counters?.estimation||{},a=c.counters?.api||{},s=Number(e.subscriberCount);
 if(!Number.isFinite(s))return null;
 number(k+'-main',s);number(k+'-goal',next(s));number(k+'-left',Math.max(0,next(s)-s));
 fields.forEach(([id,,field])=>{number(k+'-est-'+id,e[field]);number(k+'-api-'+id,a[field])});
 if(c.avatar&&$(k+'-avatar').src!==c.avatar)$(k+'-avatar').src=c.avatar;
 return s;
}
async function refresh(){
 try{
  const r=await fetch('/api/stats',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
  const d=await r.json(),z=update('zhong',d.creators?.zhong),f=update('fede',d.creators?.fede);
  if(z!==null&&f!==null){number('difference',Math.abs(z-f));$('leader').textContent=z===f?'TIED':z>f?'Zhong':'Fede Vigevani'}
  $('status').textContent=d.error?'Some stats unavailable':'LIVE · CONNECTED';
  $('updated').textContent=d.updated?'Last update: '+new Date(d.updated).toLocaleTimeString():'Waiting for update';
 }catch(e){$('status').textContent='Connection error';console.error('[Dashboard] '+e.message)}
}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
