
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucan vs VYStats | Live Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-minimal.css">
<style>:root{--bg:#080910;--bd:#292e43;--mut:#c4cce8;--w:#fff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--w);font-family:Inter,sans-serif}.pg{width:98%;height:100dvh;margin:auto;padding:5px 0;display:grid;grid-template-rows:28px minmax(0,1fr) 184px 22px;gap:6px}header,footer{display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:15px;font-weight:900;color:var(--mut);min-width:0}.br{font-size:18px;letter-spacing:2px;color:#aab2ca}.lv{color:#ff667b}.lucan{background:linear-gradient(135deg,#1a2036,#0d101b 75%);border:1px solid #343b57;border-radius:15px;padding:12px 18px;display:grid;grid-template-columns:minmax(280px,430px) minmax(0,1fr);gap:18px;align-items:center;box-shadow:0 15px 40px #0006;min-height:0;min-width:0;overflow:hidden}.left-col{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;height:100%;min-height:0;min-width:0;overflow:hidden}.prof{display:flex;align-items:flex-start;gap:14px;text-align:left;min-width:0;min-height:0;padding-top:8px}.av{border-radius:50%;object-fit:cover;background:#242941;border:3px solid #ffffff25;box-shadow:0 10px 25px #000a;flex-shrink:0}.prof .av{width:clamp(90px,14vw,220px);height:clamp(90px,14vw,220px)}.p-info{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding-top:14px}.nm{font-size:clamp(16px,1.7vw,27px);font-weight:900;letter-spacing:-.5px;line-height:1.1;overflow-wrap:anywhere}.hd{font-size:14px;color:var(--mut);margin-top:4px;font-weight:700}.desc{font-size:clamp(11px,1.1vw,17px);color:#c4cce8;font-weight:900;margin-top:10px;line-height:1.4;max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{padding:6px 11px;border-radius:6px;background:#8795ff30;color:#c4cdff;font-size:13px;font-weight:900;letter-spacing:.8px;white-space:nowrap}.nc-snapshot{position:static;flex:0 1 48%;width:48%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:3px 0;text-align:center;align-items:center;overflow:hidden;min-width:0}.nc-item{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}.nc-label{display:block;font-size:clamp(9px,.85vw,12px);font-weight:900;color:#aab2ca;line-height:1.15;overflow-wrap:anywhere;text-align:center}.nc-value{font-size:clamp(18px,2.5vw,40px);font-weight:900;color:#70d9c0;white-space:normal;display:block;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums;line-height:1.15}
<body>
<div class="pg">
<header><div class="br">LUCAN PEVIDOR · ROAD TO 60M</div><div class="lv">● LIVE</div></header>
<section class="lucan">
<div class="left-col">
<div class="prof">
<img class="av" id="lucanAvatar" alt="Lucan">
<div class="p-info">
<div class="nm" id="lucanName">Lucan Pevidor</div>
<div class="hd" id="lucanHandle">@LucanPevidor</div>
<div class="desc" id="lucanDescription"></div>
<div class="badges"><div class="tag">ROAD TO 60M</div></div>
</div>
</div>
<div class="mine-bar">
<div class="mine-title">MY CHANNEL</div>
<div class="mine-id">
<img class="av" id="mineAvatar" alt="VYStats">
<div><div class="mine-nm" id="mineName">VYStats</div><div class="mine-hd" id="mineHandle">@vystatsyt</div></div>
</div>
<div class="mine-stats">
<div class="mine-stat">
<div class="mine-stat-title">SUBSCRIBERS</div>
<div class="mine-source"><div class="mine-label">EST.</div><div class="mc odometer" id="mineEstSubs">—</div></div>
<div class="mine-source"><div class="mine-label">API</div><div class="mc odometer" id="mineApiSubs">—</div></div>
</div>
<div class="mine-stat">
<div class="mine-stat-title">TOTAL VIEWS</div>
<div class="mine-source"><div class="mine-label">EST.</div><div class="mc odometer" id="mineEstViews">—</div></div>
<div class="mine-source"><div class="mine-label">API</div><div class="mc odometer" id="mineApiViews">—</div></div>
</div>
<div class="mine-stat">
<div class="mine-stat-title">VIDEOS</div>
<div class="mine-source"><div class="mine-label">EST.</div><div class="mc odometer" id="mineEstVideos">—</div></div>
<div class="mine-source"><div class="mine-label">API</div><div class="mc odometer" id="mineApiVideos">—</div></div>
</div>
</div>
</div>
</div>
<div class="lc">
<div class="cnt top-cnt">
<div class="nc-snapshot">
<div class="nc-item"><div class="nc-label">LINEAR ESTIMATE</div><div class="nc-value odometer" id="stLinearText">—</div></div>
<div class="nc-item"><div class="nc-label">HOURLY GAIN</div><div class="nc-value odometer" id="stHourlyText">—</div></div>
<div class="nc-item"><div class="nc-label">DAILY GAIN</div><div class="nc-value odometer" id="stDailyText">—</div></div>
</div>
<div class="live-main">
<div class="lbl">LUCAN · LIVE SUBSCRIBERS (SCTOOLS EST.)</div>
<div class="big odometer" id="lucanCount">—</div>
</div>
</div>
<div class="div"></div>
<div class="cnt"><div class="lbl">SUBS GAINED PER SEC · LIVE AVG.</div><div class="rate-line"><span class="rate-plus" id="lucanRateSign">+</span><span class="rate odometer" id="lucanRate">—</span></div></div>
<div class="div"></div>
<div class="cnt"><div class="lbl">SUBSCRIBERS REMAINING TO 60,000,000</div><div class="rem odometer" id="lucanRemaining">—</div></div>
</div>
</section>
<section class="card" id="srcCard"></section>
<footer><span id="updated">WAITING FOR DATA</span><span id="status">● CONNECTING</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/odometer@0.4.8/odometer.min.js"></script>
<script>
const $=id=>document.getElementById(id),nums={},vals={},urls={},samples=[];
const rows=[["SUBSCRIBERS",[["estSubs","nc"],["stApiSubs","api"],["scEstSubs","sc"],["scApiSubs","api"]]],["TOTAL VIEWS",[["stEstViews","nc"],["stApiViews","api"],["scEstViews","sc"],["scApiViews","api"]]],["VIDEOS",[["stEstVideos","nc"],["stApiVideos","api"],["scEstVideos","sc"],["scApiVideos","api"]]]];
$("srcCard").innerHTML=`<div class="src-h"><span>DATA SOURCES</span><span>LIVE</span></div><div class="mtx"><div></div><div class="mh">SCTools Est.</div><div class="mh">SCTools API</div><div class="mh">SocialCounts Est.</div><div class="mh">SocialCounts API</div>`+rows.map(([g,c])=>`<div class="mg">${g}</div>`+c.map(([i,cl])=>`<div class="cell"><span class="vl odometer ${cl}" id="${i}">—</span></div>`).join("")).join("")+`</div>`;
const rolling=(id,v)=>{
const el=$(id),valid=v!==null&&v!==undefined&&v!==""&&Number.isFinite(Number(v));
if(!valid){if(vals[id]!==undefined){el.textContent="—";nums[id]=null;vals[id]=undefined;}else if(!nums[id])el.textContent="—";return;}
const n=Math.max(0,Math.floor(Number(v)));
if(vals[id]===n)return;
if(!nums[id]){if(window.Odometer){el.textContent="0";nums[id]=new Odometer({el,value:0,format:"(,ddd)",duration:750,theme:"minimal"});nums[id].update(n);}else el.textContent=n.toLocaleString("en-US");}
else nums[id].update(n);
vals[id]=n;
};
const rollingRate=v=>{
const el=$("lucanRate"),n=Math.round(Number(v)*100)/100;
if(!Number.isFinite(n)||vals.lucanRate===n)return;
$("lucanRateSign").textContent=n<0?"-":"+";
const display=Math.abs(n);
if(!nums.lucanRate){el.textContent="0.00";nums.lucanRate=new Odometer({el,value:0,format:"(,ddd).dd",duration:650,theme:"minimal"});}
nums.lucanRate.update(display);vals.lucanRate=n;
};
const av=(k,u)=>{if(u&&urls[k]!==u){urls[k]=u;$(`${k}Avatar`).src=`/api/avatar/${k}?v=${encodeURIComponent(u)}`;}};
const profile=(k,c)=>{
if(!c)return;
$(`${k}Name`).textContent=c.name||(k==="lucan"?"Lucan Pevidor":"VYStats");
$(`${k}Handle`).textContent=c.handle||(k==="lucan"?"@LucanPevidor":"@vystatsyt");
if(k==="lucan")$("lucanDescription").textContent=c.description||"";
av(k,c.avatar);
};
const updateRate=count=>{
const now=Date.now(),n=Number(count);
if(!Number.isFinite(n))return;
samples.push({t:now,n});
if(samples.length>2)samples.shift();
if(samples.length<2)return;
const first=samples[0],seconds=(now-first.t)/1000;
if(seconds>0)rollingRate((n-first.n)/seconds);
};
async function run(){
const s=$("status");
try{
const r=await fetch("/api/stats?t="+Date.now(),{cache:"no-store"});
if(!r.ok)throw Error("Stats request failed");
const {lucan:l={},mine:m={}}=await r.json();
const st=l.sctools??{},e=l.socialcounts?.estimation??l.estimation??{},a=l.socialcounts?.api??l.api??{};
const mst=m.sctools??{},me=m.socialcounts?.estimation??m.estimation??{},ma=m.socialcounts?.api??m.api??{};
const mainSubs=st.estSubscribers??e.subscriberCount??st.apiSubscribers??a.subscriberCount;
if(mainSubs===null||mainSubs===undefined)throw Error("Lucan subscriber data unavailable");
rolling("lucanCount",mainSubs);rolling("lucanRemaining",60000000-Number(mainSubs));updateRate(mainSubs);
[["mineEstSubs",mst.estSubscribers??me.subscriberCount],["mineApiSubs",mst.apiSubscribers??ma.subscriberCount],["mineEstViews",me.viewCount],["mineApiViews",mst.apiViews??ma.viewCount],["mineEstVideos",me.videoCount],["mineApiVideos",mst.apiVideos??ma.videoCount]].forEach(([id,v])=>rolling(id,v));
profile("lucan",l.channel);profile("mine",m.channel);
rolling("stLinearText",st.linearSubscribers);rolling("stHourlyText",st.hourly);rolling("stDailyText",st.daily);
[["estSubs",st.estSubscribers],["stApiSubs",st.apiSubscribers],["scEstSubs",e.subscriberCount],["scApiSubs",a.subscriberCount],["stEstViews",null],["stApiViews",st.apiViews],["scEstViews",e.viewCount],["scApiViews",a.viewCount],["stEstVideos",null],["stApiVideos",st.apiVideos],["scEstVideos",e.videoCount],["scApiVideos",a.videoCount]].forEach(([id,v])=>rolling(id,v));
const t=Math.max(l.updated||0,m.updated||0);
$("updated").textContent=t?"UPDATED "+new Date(t).toLocaleTimeString():"WAITING FOR DATA";
s.textContent="● CONNECTED";s.style.color="#65dfa5";
}catch{s.textContent="● RECONNECTING";s.style.color="#ff667b";}
}
run();setInterval(run,2000);
</script>
</body>
</html>
